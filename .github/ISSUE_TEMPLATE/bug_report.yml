name: Bug 报告
description: 报告可复现的缺陷，帮助我们定位问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并确认这不是安全问题（安全漏洞请走 [私密通道](https://github.com/yuedaochangmendian/eazy-tieba/security/advisories/new)）。

        本仓库是 [Dilettante258/eazy-tieba](https://github.com/Dilettante258/eazy-tieba) 的 fork；如果问题在上游同样存在，也欢迎反馈给上游。

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 这不是安全漏洞（否则我会走私密报告通道）
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Web 前端（apps/web）
        - API 服务（apps/api）
        - Mail / 导出 Worker（apps/mail）
        - SDK（packages/sdk）
        - 文档 / 工程化
    validations:
      required: true

  - type: input
    id: ref
    attributes:
      label: 版本或提交
      description: 页脚版本号、`git rev-parse --short HEAD` 或部署地址
      placeholder: v3.4.1 / 8ca0637
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 浏览器控制台、网络请求、服务端日志；注意打码 BDUSS 等凭据
      render: shell
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: 环境
      placeholder: |
        浏览器 / 系统:
        部署方式（官方站点 / 自建 / 本地 dev）:
    validations:
      required: false
