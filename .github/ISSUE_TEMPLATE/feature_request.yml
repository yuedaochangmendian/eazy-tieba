name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue；先说清楚"要解决什么问题"，再谈实现方式。
        与查询、分析、导出无关的通用贴吧功能建议，也可以先看看上游是否已有计划。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 当前遇到什么困难？谁在什么场景下会用到？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望产品怎么表现？有草图或参考链接更好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - Web 前端（apps/web）
        - API 服务（apps/api）
        - Mail / 导出 Worker（apps/mail）
        - SDK（packages/sdk）
        - 文档 / 工程化
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 你期望的优先级
      options:
        - 低：有更好，没有也行
        - 中：明显影响体验
        - 高：阻碍主要使用流程
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我愿意实现这个功能（可以先在 Issue 里对方案）
          required: false
