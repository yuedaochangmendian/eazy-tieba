name: Web Deploy (Cloudflare Pages)

on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # 上游仓库始终部署；fork 默认跳过，避免误用他人凭据。
    # 想在 fork 上部署时，设置仓库变量 ENABLE_CLOUDFLARE_DEPLOY=true，
    # 并配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_PAGES_PROJECT_NAME。
    if: >-
      github.repository == 'Dilettante258/eazy-tieba' ||
      vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: bun run --cwd apps/web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/web/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
            --branch=${{ github.ref_name }}
